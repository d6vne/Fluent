name: Remove merged multi-select fix branch (one-shot)

on:
  push:
    branches:
      - optimization
    paths:
      - ".github/workflows/cleanup-multiselect-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'd6vne/Fluent'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged multi-select feature branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/fix/multiselect-dropdown-deselection",
            });
