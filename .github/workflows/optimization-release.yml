name: Publish optimization build

on:
  push:
    branches:
      - optimization
    paths:
      - "Src/**"
      - "Addons/**"
      - "Lune/**"
      - "rokit.toml"
      - ".github/workflows/optimization-release.yml"

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'd6vne/Fluent'
    name: Build and publish downloadable Fluent.luau
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup RoKit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install build tools
        run: |
          rokit trust rojo-rbx/rojo
          rokit trust lune-org/lune
          rokit trust seaofvoices/darklua
          rokit trust UpliftGames/wally
          rokit trust JohnnyMorganz/wally-package-types
          rokit install

      - name: Build Fluent
        run: lune run Build bundle header=Lune/Build/Header.luau minify=true ci-mode=true

      - name: Publish optimization testing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tag = "v0.1.0-optimization.$env:GITHUB_RUN_NUMBER"
          $Notes = "Unverified testing build from the optimization branch. Source commit: $env:GITHUB_SHA. Test functionality and performance before merging the pull request."
          gh release create $Tag "Distribution/Fluent.luau" "Distribution/Fluent.rbxm" --target "$env:GITHUB_SHA" --title "Fluent optimization build $env:GITHUB_RUN_NUMBER" --notes "$Notes" --latest
