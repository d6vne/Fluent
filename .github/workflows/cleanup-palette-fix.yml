name: Remove merged palette fix branch (one-shot)

on:
  push:
    branches:
      - optimization
    paths:
      - ".github/workflows/cleanup-palette-fix.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'd6vne/Fluent'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged palette fix branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/fix/theme-palette-picker-sync",
            });
