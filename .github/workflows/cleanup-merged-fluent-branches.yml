name: Delete merged feature branches (one-shot)

on:
  push:
    branches:
      - optimization
    paths:
      - ".github/workflows/cleanup-merged-fluent-branches.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'd6vne/Fluent'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only the three verified merged feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'perf/instant-drag-and-ui-cleanup',
              'perf/obsidian-virtual-dropdowns',
              'rewrite/fluent-core-v2',
            ];
            for (const branch of branches) {
              core.info(`Deleting merged branch: ${branch}`);
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`,
              });
            }
