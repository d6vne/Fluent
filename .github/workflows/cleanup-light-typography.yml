name: Remove merged Light typography branch (one-shot)

on:
  push:
    branches:
      - optimization
    paths:
      - ".github/workflows/cleanup-light-typography.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'd6vne/Fluent'
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged Light typography branch
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/fix/light-typography-opacity",
            });
