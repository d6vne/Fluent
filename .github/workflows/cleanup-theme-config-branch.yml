name: Remove merged theme-config branch (one-shot)

on:
  push:
    branches:
      - optimization
    paths:
      - ".github/workflows/cleanup-theme-config-branch.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'd6vne/Fluent'
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged theme fix
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.git.deleteRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/fix/theme-config-load-isolation",
            });
